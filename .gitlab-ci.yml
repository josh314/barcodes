default:
  image: node:24

stages:
  - test
  - publish

test:
  stage: test
  script:
    - npm ci
    - npm test

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "@wazue:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish